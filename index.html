<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Birth Plan Builder</title>
<style>
  :root {
    --yes: #3a9a4a;
    --no: #d6247e;
    --tab: #6b4a2e;
    --ink: #2b2b2b;
    --paper: #ffffff;
    --line: #6b4a2e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e9e6e1; color: var(--ink); }
  .app { display: grid; grid-template-columns: 330px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { background: #faf8f5; border-right: 1px solid #d8d2c8; display: flex; flex-direction: column; min-height: 0; }
  .sidebar header { padding: 14px 16px 8px; }
  .sidebar h1 { font-size: 17px; margin: 0 0 4px; }
  .sidebar p.hint { font-size: 12px; color: #6d655b; margin: 0 0 8px; line-height: 1.4; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  button { font: inherit; font-size: 12.5px; border: 1px solid #c9c0b3; background: #fff; border-radius: 7px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #f1ece5; }
  button.primary { background: var(--tab); color: #fff; border-color: var(--tab); }
  button.primary:hover { background: #573b23; }
  .search { margin: 0 16px 8px; padding: 7px 10px; border: 1px solid #c9c0b3; border-radius: 7px; font: inherit; font-size: 13px; }
  .palette { flex: 1; overflow-y: auto; padding: 4px 10px 20px; min-height: 0; }
  .palette.drag-over { background: #f0e8dd; }
  .palette-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8a7f71; margin: 12px 6px 4px; }
  .palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .palette .card { width: auto; }
  .empty-note { font-size: 12px; color: #9a9184; padding: 4px 6px; font-style: italic; }

  /* ---------- Card ---------- */
  .card { width: 118px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 4px; border-radius: 10px; cursor: grab; position: relative; user-select: none; }
  .card:hover { background: rgba(0,0,0,.04); }
  .card.dragging { opacity: .35; }
  .card.selected { outline: 2px dashed var(--tab); background: #f3ebe1; }
  .circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--yes); transition: background .15s; cursor: pointer; flex-shrink: 0; }
  .card.no .circle { background: var(--no); }
  .circle .ico { font-size: 34px; line-height: 1; filter: brightness(0) invert(1); }
  .card.no .circle .ico.slash::after { content: ""; }
  .label { font-size: 12.5px; line-height: 1.2; margin-top: 6px; color: var(--yes); font-weight: 600; outline: none; min-height: 1.2em; word-break: break-word; }
  .card.no .label { color: var(--no); }
  .palette .circle { width: 50px; height: 50px; }
  .palette .circle .ico { font-size: 26px; }
  .palette .label { font-size: 11px; }
  .card .x { position: absolute; top: 0; right: 6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 0 0 1px #ccc; font-size: 12px; line-height: 20px; padding: 0; display: none; color: #777; }
  .card .flip { position: absolute; top: 0; left: 6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 0 0 1px #ccc; font-size: 11px; line-height: 20px; padding: 0; display: none; color: #777; }
  .doc .card:hover .x, .doc .card:hover .flip { display: block; }
  .exporting .card .x, .exporting .card .flip { display: none !important; }

  /* ---------- Document ---------- */
  .stage { overflow: auto; padding: 28px; display: flex; justify-content: center; align-items: flex-start; }
  .doc { width: 1100px; min-height: 850px; background: var(--paper); box-shadow: 0 6px 30px rgba(0,0,0,.15); padding: 30px 36px 26px; display: flex; flex-direction: column; }
  .doc-head { text-align: center; margin-bottom: 14px; }
  .doc-title { font-size: 34px; font-weight: 300; margin: 0; outline: none; letter-spacing: .01em; }
  .doc-sub { font-size: 14px; color: #6d655b; margin-top: 4px; outline: none; }
  .legend { display: flex; justify-content: center; gap: 22px; font-size: 12.5px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 30px 22px; flex: 1; align-content: start; padding-top: 18px; }
  .section { border: 2px solid var(--line); border-radius: 22px; position: relative; padding: 30px 12px 12px; min-height: 150px; }
  .section.wide { grid-column: span 2; }
  .section.drag-over, .section.target { background: #f7f1e9; }
  .section-tab { position: absolute; top: -18px; left: 22px; background: var(--tab); color: #fff; font-size: 19px; padding: 6px 22px; border-radius: 6px; outline: none; white-space: nowrap; }
  .section-tools { position: absolute; top: -14px; right: 16px; display: none; gap: 4px; }
  .section:hover .section-tools { display: flex; }
  .exporting .section-tools { display: none !important; }
  .section-tools button { padding: 2px 7px; font-size: 11px; }
  .items { display: flex; flex-wrap: wrap; gap: 4px 2px; justify-content: center; min-height: 100px; align-content: flex-start; }
  .items .placeholder { width: 4px; align-self: stretch; background: var(--tab); border-radius: 2px; margin: 0 -1px; }
  .drop-hint { color: #b3a898; font-size: 13px; align-self: center; padding: 30px 0; font-style: italic; }
  .exporting .drop-hint { visibility: hidden; }
  .notes-box { margin-top: 22px; border: 2px solid var(--line); border-radius: 18px; padding: 26px 16px 12px; position: relative; }
  .notes-box .section-tab { font-size: 16px; top: -16px; }
  .notes { min-height: 40px; font-size: 13.5px; line-height: 1.45; outline: none; white-space: pre-wrap; }
  .notes:empty::before { content: attr(data-placeholder); color: #b3a898; font-style: italic; }
  .exporting .notes:empty::before { content: ""; }
  .notes-box.hidden { display: none; }

  /* ---------- Modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal h2 { font-size: 16px; margin: 0 0 12px; }
  .modal label { display: block; font-size: 12px; color: #6d655b; margin: 10px 0 3px; }
  .modal input, .modal select { width: 100%; padding: 7px 9px; border: 1px solid #c9c0b3; border-radius: 7px; font: inherit; font-size: 13px; }
  .emoji-pick { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .emoji-pick span { font-size: 20px; cursor: pointer; padding: 3px; border-radius: 5px; }
  .emoji-pick span:hover { background: #eee; }
  .modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header>
      <h1>🌱 Birth Plan Builder</h1>
      <p class="hint">
        <b>Drag</b> preferences onto the page (or click one, then click a section).<br>
        <b>Click the circle</b> to flip between <span style="color:var(--yes);font-weight:600">want</span> / <span style="color:var(--no);font-weight:600">don't want</span>.<br>
        <b>Click any text</b> on the page to edit it. Drag back here to remove.
      </p>
    </header>
    <div class="toolbar">
      <button class="primary" id="exportBtn">⬇ Export PNG</button>
      <button id="addItemBtn">＋ Custom item</button>
      <button id="addSectionBtn">＋ Section</button>
      <button id="notesBtn">Notes box</button>
      <button id="resetBtn" title="Clear everything">Reset</button>
    </div>
    <input class="search" id="search" placeholder="Search preferences…">
    <div class="palette" id="palette"></div>
  </aside>

  <main class="stage">
    <div class="doc" id="doc">
      <div class="doc-head">
        <h2 class="doc-title" contenteditable="true" id="title" spellcheck="false"></h2>
        <div class="doc-sub" contenteditable="true" id="subtitle" spellcheck="false"></div>
        <div class="legend">
          <span><i class="dot" style="background:var(--yes)"></i>Yes, please</span>
          <span><i class="dot" style="background:var(--no)"></i>No, thank you</span>
        </div>
      </div>
      <div class="sections" id="sections"></div>
      <div class="notes-box" id="notesBox">
        <div class="section-tab">Additional Notes</div>
        <div class="notes" id="notes" contenteditable="true" data-placeholder="Click to add any extra notes for your care team…"></div>
      </div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2>Add a custom preference</h2>
    <label>Icon (any emoji)</label>
    <input id="mIcon" maxlength="4" value="⭐">
    <div class="emoji-pick" id="emojiPick"></div>
    <label>"Want" wording (green)</label>
    <input id="mYes" placeholder="e.g. Dim lights">
    <label>"Don't want" wording (pink) — optional</label>
    <input id="mNo" placeholder="e.g. Keep lights on">
    <div class="row">
      <button id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Add</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

  { id:'home-long',   g:'Pre-Labor', icon:'🏠', yes:'Labor at home as long as possible', no:'Come to hospital early' },
  { id:'doula',       g:'Pre-Labor', icon:'🤝', yes:'Doula present', no:'No doula' },
  { id:'clothes',     g:'Pre-Labor', icon:'👕', yes:'Wear my own clothes', no:'Hospital gown OK' },
  { id:'gbs',         g:'Pre-Labor', icon:'🦠', yes:'GBS antibiotics if positive', no:'Discuss GBS options first' },

  { id:'squat-bar',   g:'Comfort Measures', icon:'🏋️', yes:'Squat bar', no:'No squat bar' },

  // Labor & delivery additions
  { id:'nitrous',     g:'Labor & Delivery', icon:'💨', yes:'Nitrous oxide wanted', no:'No nitrous oxide' },
  { id:'iv-pain',     g:'Labor & Delivery', icon:'🩺', yes:'IV pain medication OK', no:'No IV narcotics' },
  { id:'wireless',    g:'Labor & Delivery', icon:'📡', yes:'Wireless monitoring', no:'Wired monitoring OK' },
  { id:'water-birth', g:'Labor & Delivery', icon:'🌊', yes:'Water birth', no:'No water birth' },
  { id:'push-time',   g:'Labor & Delivery', icon:'⌛', yes:'No time limit on pushing', no:'Follow standard pushing time' },
  { id:'compress',    g:'Labor & Delivery', icon:'♨️', yes:'Warm compresses on perineum', no:'No warm compresses' },
  { id:'tear',        g:'Labor & Delivery', icon:'🩹', yes:'Prefer natural tear over cut', no:'Episiotomy if provider prefers' },
  { id:'assisted',    g:'Labor & Delivery', icon:'🔧', yes:'Vacuum / forceps only if necessary', no:'Vacuum / forceps OK' },
  { id:'touch-head',  g:'Labor & Delivery', icon:'👋', yes:'Touch baby\'s head as it crowns', no:'Don\'t offer to touch baby\'s head' },
  { id:'catch',       g:'Labor & Delivery', icon:'🫴', yes:'Partner helps catch baby', no:'Provider catches baby' },
  { id:'announce',    g:'Labor & Delivery', icon:'📣', yes:'Partner announces the sex', no:'Provider announces the sex' },
  { id:'hands-off',   g:'Labor & Delivery', icon:'🙌', yes:'Hands-off delivery', no:'Active guidance at delivery' },
  // After birth additions
  { id:'golden',      g:'After Birth', icon:'☀️', yes:'Uninterrupted golden hour', no:'Routine procedures right away' },
  { id:'exam-chest',  g:'After Birth', icon:'🩺', yes:'Newborn exam on my chest', no:'Newborn exam in warmer' },
  { id:'physio-placenta', g:'After Birth', icon:'🌳', yes:'Physiological placenta delivery', no:'Active management (Pitocin) OK' },
  { id:'lactation',   g:'After Birth', icon:'🫶', yes:'Lactation consultant visit', no:'No lactation consultant' },
  { id:'glucose',     g:'After Birth', icon:'🍬', yes:'Glucose gel before formula', no:'Formula if blood sugar low' },
  { id:'donor-milk',  g:'After Birth', icon:'🧴', yes:'Donor milk if supplementing', no:'Formula if supplementing' },
  { id:'with-partner',g:'After Birth', icon:'👨‍🍼', yes:'Baby stays with partner if separated', no:'Baby may go to nursery alone' },
  { id:'hearing',     g:'After Birth', icon:'👂', yes:'Newborn hearing screen', no:'Decline hearing screen' },
  { id:'pp-visitors', g:'After Birth', icon:'🚫', yes:'Limit postpartum visitors', no:'Visitors welcome postpartum' },
];

const DEFAULT_SECTIONS = [
  { id:'s1', name:'Pre-Labor', wide:false },
  { id:'s2', name:'Labor & Delivery', wide:false },
  { id:'s3', name:'After Birth', wide:false },
  { id:'s4', name:'In Case of C-Section', wide:false },
];

const KEY = 'visual-birth-plan-v1';
const defaultState = () => ({
  title: 'Birth Preferences',
  subtitle: 'Name · Partner · Due date · Provider',
  notes: '',
  showNotes: true,
  sections: DEFAULT_SECTIONS.map(s => ({ ...s, items: [] })),
  custom: [],
  choice: {},   // id -> 'yes' | 'no'
  labels: {},   // id -> { yes, no } overrides
});
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); } catch { state = defaultState(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

const allItems = () => [...CATALOG, ...state.custom];
const itemById = id => allItems().find(i => i.id === id);
const choiceOf = it => state.choice[it.id] || it.def || 'yes';
const labelOf = (it, c = choiceOf(it)) => (state.labels[it.id]?.[c]) ?? (c === 'yes' ? it.yes : (it.no || 'No ' + it.yes.toLowerCase()));
const placedIds = () => new Set(state.sections.flatMap(s => s.items));
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let selectedId = null; // click-to-place

// ---------- Rendering ----------
function cardEl(it, inDoc) {
  const c = choiceOf(it);
  const el = document.createElement('div');
  el.className = 'card ' + c + (selectedId === it.id && !inDoc ? ' selected' : '');
  el.draggable = true;
  el.dataset.id = it.id;
  el.innerHTML = `
    ${inDoc ? '<button class="flip" title="Swap want / don\'t want">⇄</button><button class="x" title="Remove">✕</button>' : ''}
    <div class="circle" title="Click to toggle want / don't want"><span class="ico">${it.icon}</span></div>
    <div class="label" ${inDoc ? 'contenteditable="true" spellcheck="false"' : ''}>${esc(labelOf(it))}</div>`;

  el.querySelector('.circle').addEventListener('click', e => { if (!inDoc || selectedId) return; e.stopPropagation(); toggle(it.id); });
  el.querySelector('.flip')?.addEventListener('click', e => { e.stopPropagation(); toggle(it.id); });
  el.querySelector('.x')?.addEventListener('click', e => { e.stopPropagation(); removeItem(it.id); });
  if (inDoc) {
    const lab = el.querySelector('.label');
    lab.addEventListener('mousedown', e => e.stopPropagation());
    lab.addEventListener('focus', () => el.draggable = false);
    lab.addEventListener('blur', () => {
      el.draggable = true;
      const txt = lab.innerText.trim();
      state.labels[it.id] = { ...(state.labels[it.id] || {}), [choiceOf(it)]: txt };
      save(); renderPalette();
    });
    lab.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); lab.blur(); } });
  } else {
    el.addEventListener('click', () => {
      selectedId = selectedId === it.id ? null : it.id;
      document.querySelectorAll('.section').forEach(s => s.classList.toggle('target', !!selectedId));
      renderPalette();
      if (selectedId) toast('Now click a section on the page to place it');
    });
  }
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', it.id);
    e.dataTransfer.effectAllowed = 'move';
    dragId = it.id;
    requestAnimationFrame(() => el.classList.add('dragging'));
  });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); clearPlaceholders(); dragId = null; });
  return el;
}

function renderPalette() {
  const pal = document.getElementById('palette');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const placed = placedIds();
  pal.innerHTML = '';
  const groups = {};
  for (const it of allItems()) {
    if (placed.has(it.id)) continue;
    if (q && !(it.yes + ' ' + (it.no || '') + ' ' + labelOf(it)).toLowerCase().includes(q)) continue;
    (groups[it.g || 'Custom'] ||= []).push(it);
  }
  const ORDER = ['Pre-Labor','Labor & Delivery','Comfort Measures','After Birth','In Case of C-Section','Custom'];
  const names = Object.keys(groups).sort((a,b) => ((ORDER.indexOf(a)+1)||99) - ((ORDER.indexOf(b)+1)||99));
  if (!names.length) pal.innerHTML = '<div class="empty-note">Nothing left here — everything is on your plan.</div>';
  for (const g of names) {
    const wrap = document.createElement('div');
    wrap.className = 'palette-group';
    wrap.innerHTML = `<h3>${esc(g)}</h3>`;
    const grid = document.createElement('div');
    grid.className = 'palette-grid';
    groups[g].forEach(it => grid.appendChild(cardEl(it, false)));
    wrap.appendChild(grid);
    pal.appendChild(wrap);
  }
}

function renderDoc() {
  document.getElementById('title').innerText = state.title;
  document.getElementById('subtitle').innerText = state.subtitle;
  document.getElementById('notes').innerText = state.notes;
  document.getElementById('notesBox').classList.toggle('hidden', !state.showNotes);
  const wrap = document.getElementById('sections');
  wrap.innerHTML = '';
  state.sections.forEach((s, idx) => {
    const sec = document.createElement('div');
    sec.className = 'section' + (s.wide ? ' wide' : '') + (selectedId ? ' target' : '');
    sec.dataset.sid = s.id;
    sec.innerHTML = `
      <div class="section-tab" contenteditable="true" spellcheck="false">${esc(s.name)}</div>
      <div class="section-tools">
        <button data-a="up" title="Move earlier">◀</button>
        <button data-a="down" title="Move later">▶</button>
        <button data-a="wide" title="Toggle full width">${s.wide ? 'Half width' : 'Full width'}</button>
        <button data-a="del" title="Delete section">🗑</button>
      </div>
      <div class="items"></div>`;
    const items = sec.querySelector('.items');
    s.items.forEach(id => { const it = itemById(id); if (it) items.appendChild(cardEl(it, true)); });
    if (!s.items.length) items.innerHTML = '<div class="drop-hint">Drag preferences here</div>';

    const tab = sec.querySelector('.section-tab');
    tab.addEventListener('blur', () => { s.name = tab.innerText.trim() || 'Section'; save(); });
    tab.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); tab.blur(); } });

    sec.querySelector('.section-tools').addEventListener('click', e => {
      const a = e.target.dataset.a; if (!a) return;
      if (a === 'wide') s.wide = !s.wide;
      if (a === 'up' && idx > 0) [state.sections[idx-1], state.sections[idx]] = [state.sections[idx], state.sections[idx-1]];
      if (a === 'down' && idx < state.sections.length - 1) [state.sections[idx+1], state.sections[idx]] = [state.sections[idx], state.sections[idx+1]];
      if (a === 'del') { if (!confirm(`Delete "${s.name}"? Its items go back to the list.`)) return; state.sections.splice(idx, 1); }
      save(); render();
    });

    sec.addEventListener('click', e => {
      if (!selectedId || e.target.closest('.section-tab,.section-tools')) return;
      const onCard = e.target.closest('.card');
      moveItem(selectedId, s.id, onCard ? s.items.indexOf(onCard.dataset.id) : s.items.length);
      selectedId = null; render();
    });

    sec.addEventListener('dragover', e => {
      e.preventDefault();
      sec.classList.add('drag-over');
      showPlaceholder(items, e.clientX, e.clientY);
    });
    sec.addEventListener('dragleave', e => { if (!sec.contains(e.relatedTarget)) { sec.classList.remove('drag-over'); clearPlaceholders(); } });
    sec.addEventListener('drop', e => {
      e.preventDefault();
      sec.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const ph = items.querySelector('.placeholder');
      let index = s.items.length;
      if (ph) index = [...items.children].filter(c => c.classList.contains('card') || c.classList.contains('placeholder'))
                        .filter(c => !c.classList.contains('dragging') || c === ph)
                        .indexOf(ph);
      clearPlaceholders();
      if (id) moveItem(id, s.id, index);
    });
    wrap.appendChild(sec);
  });
}

function render() { renderDoc(); renderPalette(); }

// ---------- Drag helpers ----------
let dragId = null;
function clearPlaceholders() { document.querySelectorAll('.placeholder').forEach(p => p.remove()); }
function showPlaceholder(items, x, y) {
  const cards = [...items.querySelectorAll('.card:not(.dragging)')];
  let before = null;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    const sameRow = y >= r.top && y <= r.bottom;
    if ((sameRow && x < r.left + r.width / 2) || y < r.top) { before = c; break; }
  }
  let ph = items.querySelector('.placeholder');
  if (!ph) { clearPlaceholders(); ph = document.createElement('div'); ph.className = 'placeholder'; }
  if (before) { if (ph.nextSibling !== before) items.insertBefore(ph, before); }
  else if (items.lastElementChild !== ph) items.appendChild(ph);
}

// ---------- Mutations ----------
function moveItem(id, sid, index) {
  for (const s of state.sections) { const i = s.items.indexOf(id); if (i >= 0) { s.items.splice(i, 1); if (s.id === sid && i < index) index--; } }
  const target = state.sections.find(s => s.id === sid);
  target.items.splice(Math.max(0, Math.min(index, target.items.length)), 0, id);
  save(); render();
}
function removeItem(id) {
  state.sections.forEach(s => s.items = s.items.filter(x => x !== id));
  save(); render();
}
function toggle(id) {
  const it = itemById(id);
  state.choice[id] = choiceOf(it) === 'yes' ? 'no' : 'yes';
  save(); render();
}

const pal = document.getElementById('palette');
pal.addEventListener('dragover', e => { e.preventDefault(); pal.classList.add('drag-over'); });
pal.addEventListener('dragleave', e => { if (!pal.contains(e.relatedTarget)) pal.classList.remove('drag-over'); });
pal.addEventListener('drop', e => { e.preventDefault(); pal.classList.remove('drag-over'); const id = e.dataTransfer.getData('text/plain'); if (id) removeItem(id); });

// ---------- Header / notes editing ----------
for (const [elId, key] of [['title','title'],['subtitle','subtitle'],['notes','notes']]) {
  const el = document.getElementById(elId);
  el.addEventListener('blur', () => { state[key] = el.innerText.trim(); save(); });
  if (key !== 'notes') el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
}
document.getElementById('search').addEventListener('input', renderPalette);
document.getElementById('notesBtn').addEventListener('click', () => { state.showNotes = !state.showNotes; save(); render(); });
document.getElementById('addSectionBtn').addEventListener('click', () => {
  state.sections.push({ id: 's' + Date.now(), name: 'New Section', wide: false, items: [] });
  save(); render();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Clear your whole plan and start over?')) return;
  state = defaultState(); save(); render();
});

// ---------- Custom items ----------
const modal = document.getElementById('modalBg');
const EMOJIS = ['⭐','💡','🎵','🕯️','🙏','📷','🧸','🌸','🧊','🔥','🍯','🧴','🧦','🎧','📵','🚪','🤫','❤️','🍼','👨‍👩‍👧','🧬','🏥','⏰','🩹'];
document.getElementById('emojiPick').innerHTML = EMOJIS.map(e => `<span>${e}</span>`).join('');
document.getElementById('emojiPick').addEventListener('click', e => { if (e.target.tagName === 'SPAN') document.getElementById('mIcon').value = e.target.textContent; });
document.getElementById('addItemBtn').addEventListener('click', () => { modal.classList.add('open'); document.getElementById('mYes').focus(); });
document.getElementById('mCancel').addEventListener('click', () => modal.classList.remove('open'));
document.getElementById('mSave').addEventListener('click', () => {
  const yes = document.getElementById('mYes').value.trim();
  if (!yes) return document.getElementById('mYes').focus();
  state.custom.push({ id: 'c' + Date.now(), g: 'Custom', icon: document.getElementById('mIcon').value.trim() || '⭐', yes, no: document.getElementById('mNo').value.trim() || undefined });
  ['mYes','mNo'].forEach(i => document.getElementById(i).value = '');
  modal.classList.remove('open'); save(); render();
  toast('Added to the "Custom" group in the sidebar');
});

// ---------- Export ----------
document.getElementById('exportBtn').addEventListener('click', async () => {
  const doc = document.getElementById('doc');
  document.activeElement?.blur();
  selectedId = null; render();
  doc.classList.add('exporting');
  try {
    const url = await htmlToImage.toPng(doc, { pixelRatio: 2, backgroundColor: '#ffffff' });
    const a = document.createElement('a');
    a.href = url;
    a.download = (state.title || 'birth-plan').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.png';
    a.click();
    toast('Exported!');
  } catch (err) {
    console.error(err);
    toast('Export failed — try Print (⌘P) → Save as PDF instead');
  } finally {
    doc.classList.remove('exporting');
  }
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

render();
</script>
